<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TASK_014 · Концепция C — Premium Banking</title>
<style>
/* ================================================================
   TASK_014 · Концепция C — «Premium Banking»
   ВРЕМЕННЫЙ СТАТИЧЕСКИЙ ПРОТОТИП. Не подключён к sw.js, не часть
   production-архитектуры. Только для оценки дизайна.
   Нейтрально-тёплый фон, почти чёрная типографика, никаких
   декоративных эффектов, цвет — только маркер типа операции.
   ================================================================ */
:root{
  --page-bg:#f4f3f0;              /* нейтральный тёплый */
  --card:#ffffff;
  --stroke:#e4e2dc;               /* тёплый hairline-stroke */
  --sep:#ece9e3;
  --ink:#111214;                  /* почти чёрная типографика */
  --muted:#6d6a63;
  --muted2:#a3a09a;
  --fill:rgba(17,18,20,.05);
  /* сдержанные премиальные акценты */
  --tx-expense:#b3453d;
  --tx-income:#2f7a4f;
  --tx-transfer:#33506f;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,sans-serif;
  background:var(--page-bg);color:var(--ink);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden;
}

/* ---------- Header ---------- */
.hdr{
  flex:0 0 auto;position:relative;z-index:5;
  display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 18px 12px;
  background:var(--page-bg);box-shadow:0 1px 0 var(--stroke);
}
.hdr .ttl{
  text-align:center;font-size:12.5px;font-weight:700;letter-spacing:1.1px;
  text-transform:uppercase;color:var(--muted);
}
.close{
  width:32px;height:32px;border:1px solid var(--stroke);border-radius:50%;background:none;
  color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.close svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;fill:none}

.body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:20px 18px 0}

/* ---------- Segmented control: строгий, без заливки ---------- */
.seg{position:relative;display:flex;gap:0;margin:0 0 30px;border-bottom:1px solid var(--stroke)}
.seg button{
  position:relative;flex:1;border:none;background:none;padding:0 4px 13px;
  font:600 14.5px/1 inherit;color:var(--muted2);cursor:pointer;letter-spacing:-.1px;
}
.seg button.on{color:var(--ink);font-weight:700}
.seg .ind{
  position:absolute;bottom:-1px;left:0;width:33.333%;height:2px;background:var(--tx-expense);
  transition:transform .24s cubic-bezier(.34,1.05,.4,1);
}

/* ---------- Сумма ---------- */
.hero{padding:2px 2px 30px}
.hero .lbl{font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted2);margin-bottom:12px}
.hero .amt{
  font-size:52px;font-weight:600;letter-spacing:-2px;line-height:1;color:var(--ink);
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;white-space:nowrap;
}
.hero .amt .sign{color:var(--tx-expense);font-weight:500}
.hero .amt .cur{font-size:30px;font-weight:500;color:var(--muted);margin-left:7px;letter-spacing:-1px}
.hero .cap{margin-top:12px;font-size:12.5px;color:var(--muted)}

/* ---------- Карточки: строгие, тонкий stroke, без теней ---------- */
.grp{margin-bottom:18px}
.grp > .lbl{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted2);padding:0 2px 9px}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:16px;overflow:hidden}
.row{
  display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:12px 16px;
  border:none;background:none;font-family:inherit;text-align:left;cursor:pointer;position:relative;color:var(--ink);
}
.row:active{background:var(--fill)}
.row + .row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep)}
.row .bar{flex:0 0 3px;width:3px;height:22px;border-radius:2px;background:var(--stroke)}
.row .nm{flex:0 0 auto;font-size:15px;font-weight:500;color:var(--muted)}
.row .val{margin-left:auto;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56%;text-align:right}
.row .val.sec{font-weight:500;color:var(--muted)}
.row .chev{flex:0 0 auto;margin-left:9px}
.row .chev svg{display:block;width:7px;height:12px;stroke:var(--muted2);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.row.note{align-items:flex-start;padding-top:15px;padding-bottom:15px}
.row.note .txt{font-size:15.5px;font-weight:500}
.more{display:flex;align-items:center;justify-content:center;width:100%;padding:15px;border:none;background:none;
  font:600 13px/1 inherit;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);cursor:pointer;font-family:inherit}

/* ---------- Футер ---------- */
.footer{
  flex:0 0 auto;padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  background:var(--page-bg);box-shadow:0 -1px 0 var(--stroke);
}
.cta{
  width:100%;height:56px;border:none;border-radius:17px;background:var(--ink);color:#fff;
  font:600 16.5px/1 inherit;cursor:pointer;letter-spacing:-.1px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:filter .12s ease,transform .12s ease;
}
.cta:active{transform:scale(.99);filter:brightness(1.35)}
.cta .tag{width:7px;height:7px;border-radius:50%;background:var(--tx-expense)}
.cta:disabled{background:var(--fill);color:var(--muted2);cursor:default}
</style>
</head>
<body>

<div class="hdr">
  <button class="close" aria-label="Закрыть">
    <svg viewBox="0 0 14 14"><path d="M1 1l12 12M13 1L1 13"/></svg>
  </button>
  <div class="ttl">Новая операция</div>
  <span></span>
</div>

<div class="body">

  <div class="seg">
    <span class="ind" style="transform:translateX(0)"></span>
    <button class="on">Расход</button>
    <button>Доход</button>
    <button>Перевод</button>
  </div>

  <div class="hero">
    <div class="lbl">Сумма расхода</div>
    <div class="amt"><span class="sign">−</span>1 250<span class="cur">EUR</span></div>
    <div class="cap">Нажмите, чтобы изменить</div>
  </div>

  <div class="grp">
    <div class="lbl">Операция</div>
    <div class="card">
      <button class="row">
        <span class="bar" style="background:#2f7a4f"></span>
        <span class="nm">Категория</span>
        <span class="val">Продукты</span>
        <span class="chev"><svg viewBox="0 0 8 13"><path d="M1 1l5.5 5.5L1 12"/></svg></span>
      </button>
      <button class="row">
        <span class="bar"></span>
        <span class="nm">Подкатегория</span>
        <span class="val sec">Супермаркет</span>
        <span class="chev"><svg viewBox="0 0 8 13"><path d="M1 1l5.5 5.5L1 12"/></svg></span>
      </button>
      <button class="row">
        <span class="bar" style="background:#f5a524"></span>
        <span class="nm">Счёт</span>
        <span class="val">Наличные</span>
        <span class="chev"><svg viewBox="0 0 8 13"><path d="M1 1l5.5 5.5L1 12"/></svg></span>
      </button>
      <button class="row">
        <span class="bar" style="background:#33506f"></span>
        <span class="nm">Дата</span>
        <span class="val">Сегодня</span>
        <span class="chev"><svg viewBox="0 0 8 13"><path d="M1 1l5.5 5.5L1 12"/></svg></span>
      </button>
    </div>
  </div>

  <div class="grp">
    <div class="lbl">Детали</div>
    <div class="card">
      <div class="row note">
        <span class="bar"></span>
        <span class="txt">Продукты на неделю</span>
      </div>
      <button class="row">
        <span class="bar"></span>
        <span class="nm">Чек</span>
        <span class="val sec">Добавить</span>
        <span class="chev"><svg viewBox="0 0 8 13"><path d="M1 1l5.5 5.5L1 12"/></svg></span>
      </button>
    </div>
  </div>

  <div class="grp">
    <div class="card"><button class="more">Дополнительно</button></div>
  </div>

</div>

<div class="footer">
  <button class="cta"><span class="tag"></span>Сохранить расход</button>
</div>

</body>
</html>
