<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Финансы — Money Flow</title>
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Финансы">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0f1115; --bg2:#171a21; --card:#1c2029; --card2:#232834;
    --line:#2a2f3a; --text:#e7ebf2; --muted:#8b93a3; --muted2:#5d6573;
    --accent:#7c5cff; --accent2:#a06bff; --accent-soft:#7c5cff22;
    --income:#3ecf8e; --income-soft:#3ecf8e1f;
    --expense:#ff6b6b; --expense-soft:#ff6b6b1f;
    --shadow:0 8px 30px rgba(0,0,0,.35);
    --navh:64px;
  }
  [data-theme="light"]{
    --bg:#f1f3f9; --bg2:#e9edf5; --card:#ffffff; --card2:#f5f7fb;
    --line:#e6eaf2; --text:#1a1f29; --muted:#6b7488; --muted2:#9aa3b5;
    --accent:#7c5cff; --accent2:#a06bff; --accent-soft:#7c5cff14;
    --income:#1aa179; --income-soft:#1aa17914;
    --expense:#e23b48; --expense-soft:#e23b4814;
    --shadow:0 8px 30px rgba(40,60,120,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;
    -webkit-font-smoothing:antialiased;transition:background .3s}
  .app{max-width:560px;margin:0 auto;min-height:100vh;position:relative;
    padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 12px)}

  /* ===== Top bar ===== */
  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);
    padding:max(14px,env(safe-area-inset-top)) 16px 8px}
  .topbar .row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .topbar h1{font-size:19px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:9px}
  .topbar h1 .lg{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;font-size:15px}
  .topbar .acts{display:flex;gap:7px}
  .iconbtn{width:36px;height:36px;border:none;border-radius:10px;background:var(--card);color:var(--text);
    cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);transition:.15s}
  .iconbtn:active{transform:scale(.92)}

  /* period segmented */
  .periods{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
  .periods button{flex:1;border:none;background:none;color:var(--muted);font-size:12.5px;font-weight:600;
    padding:8px 4px;border-radius:9px;cursor:pointer;transition:.15s}
  .periods button.on{background:var(--accent);color:#fff}
  .navrow{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:10px}
  .navrow button{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;width:34px;height:34px;border-radius:9px}
  .navrow button:active{background:var(--card)}
  .navrow .lbl{font-size:14.5px;font-weight:600;min-width:150px;text-align:center;text-transform:capitalize}

  /* ===== Screens ===== */
  .screen{display:none;padding:8px 16px 20px;animation:fade .2s}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

  /* summary card */
  .summary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:20px;padding:18px 20px;
    color:#fff;box-shadow:0 10px 30px rgba(124,92,255,.35);margin-bottom:16px}
  .summary .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
  .summary .bal-l{font-size:12.5px;opacity:.85}
  .summary .bal{font-size:30px;font-weight:800;letter-spacing:-.6px;margin-top:2px}
  .summary .ie{display:flex;gap:10px}
  .summary .ie .b{flex:1;background:rgba(255,255,255,.16);border-radius:13px;padding:11px 13px;backdrop-filter:blur(4px)}
  .summary .ie .l{font-size:11.5px;opacity:.85;display:flex;align-items:center;gap:5px}
  .summary .ie .v{font-size:16px;font-weight:700;margin-top:3px}
  .summary .ie .ar{font-size:13px}

  /* tx list grouped by day */
  .daygroup{margin-bottom:6px}
  .dayhead{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 8px}
  .dayhead .dl{font-size:13px;font-weight:600;color:var(--muted)}
  .dayhead .dr{font-size:12.5px;font-weight:600}
  .daycard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .tx{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s}
  .tx:last-child{border-bottom:none}
  .tx:active{background:var(--card2)}
  .tx .em{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .tx .info{flex:1;min-width:0}
  .tx .t1{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tx .t2{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tx .amt{font-weight:700;font-size:15px;white-space:nowrap}
  .tx .amt.inc{color:var(--income)} .tx .amt.exp{color:var(--text)}

  .empty{text-align:center;padding:56px 16px;color:var(--muted2)}
  .empty .big{font-size:44px;margin-bottom:12px}
  .empty p{font-size:13.5px;line-height:1.5}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .panel h3{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
  .panel h3 .hint{font-size:11.5px;color:var(--muted);font-weight:400}
  .chart-box{position:relative;height:230px}
  .chart-box.tall{height:260px}
  .catlist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .catrow{display:flex;align-items:center;gap:10px;font-size:13.5px}
  .catrow .cdot{width:11px;height:11px;border-radius:4px;flex-shrink:0}
  .catrow .cname{flex:1;color:var(--muted)}
  .catrow .cval{font-weight:600}
  .catrow .cpct{color:var(--muted2);font-size:11.5px;width:40px;text-align:right}

  /* accounts */
  .acc{display:flex;align-items:center;gap:13px;padding:14px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;margin-bottom:10px}
  .acc .em{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px}
  .acc .nm{flex:1;font-size:15px;font-weight:600}
  .acc .bal{font-size:16px;font-weight:700}
  .addline{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border:1.5px dashed var(--line);
    border-radius:16px;color:var(--muted);font-size:14px;cursor:pointer;background:none;width:100%}
  .addline:active{background:var(--card)}

  /* budgets */
  .bud{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
  .bud .h{display:flex;align-items:center;gap:11px;margin-bottom:10px}
  .bud .em{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px}
  .bud .nm{flex:1;font-size:14.5px;font-weight:600}
  .bud .lim{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
  .bud .lim input{width:62px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);
    color:var(--text);font-size:13px;text-align:right;font-family:inherit}
  .progress{height:9px;border-radius:6px;background:var(--bg2);overflow:hidden}
  .progress .fill{height:100%;border-radius:6px;transition:width .4s}
  .bud .sub{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted2);margin-top:7px}

  /* settings rows */
  .setrow{display:flex;align-items:center;justify-content:space-between;padding:15px;background:var(--card);
    border:1px solid var(--line);border-radius:14px;margin-bottom:10px;font-size:14.5px}
  .setrow select,.setrow button{padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);
    color:var(--text);font-size:13.5px;cursor:pointer;font-family:inherit}
  .setrow button.danger{color:var(--expense);border-color:var(--expense)}

  /* ===== Bottom nav ===== */
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-around;height:var(--navh);
    padding-bottom:env(safe-area-inset-bottom);max-width:560px;margin:0 auto}
  .nav button{background:none;border:none;color:var(--muted2);display:flex;flex-direction:column;align-items:center;gap:3px;
    cursor:pointer;font-size:10.5px;flex:1;padding:6px 0;transition:.15s}
  .nav button .ic{font-size:20px}
  .nav button.on{color:var(--accent)}
  .nav .addbtn{flex:0 0 auto}
  .nav .addbtn .plus{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;margin-top:-22px;
    box-shadow:0 8px 22px rgba(124,92,255,.5);transition:.15s}
  .nav .addbtn:active .plus{transform:scale(.92)}

  /* ===== Add sheet ===== */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);display:none;
    align-items:flex-end;justify-content:center;z-index:60}
  .overlay.show{display:flex}
  .sheet{background:var(--bg);width:100%;max-width:560px;border-radius:26px 26px 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:var(--shadow);
    animation:up .25s ease;max-height:96vh;overflow-y:auto}
  @keyframes up{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}
  .sheet .grab{width:40px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 14px}
  .seg{display:flex;background:var(--card);border-radius:13px;padding:4px;margin-bottom:14px;border:1px solid var(--line)}
  .seg button{flex:1;border:none;background:none;padding:11px;border-radius:10px;color:var(--muted);font-size:14.5px;font-weight:600;cursor:pointer;transition:.15s}
  .seg button.on-exp{background:var(--expense);color:#fff}
  .seg button.on-inc{background:var(--income);color:#fff}
  .display{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;
    display:flex;align-items:center;justify-content:space-between;min-height:60px}
  .display .cur{font-size:20px;color:var(--muted);font-weight:700}
  .display .num{font-size:30px;font-weight:800;letter-spacing:-.5px;text-align:right;flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cat-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  .cat-strip::-webkit-scrollbar{display:none}
  .cat-pick{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;width:66px;padding:9px 4px;
    border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:.12s}
  .cat-pick.sel{border-color:var(--accent);background:var(--accent-soft)}
  .cat-pick .ce{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px}
  .cat-pick .cl{font-size:10px;color:var(--muted);text-align:center;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
  .metarow{display:flex;gap:8px;margin-bottom:12px}
  .metarow .m{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
  .metarow .m label{font-size:10.5px;color:var(--muted);display:block;margin-bottom:3px}
  .metarow .m input,.metarow .m select{width:100%;border:none;background:none;color:var(--text);font-size:13.5px;font-family:inherit;outline:none}
  .keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .keypad button{padding:16px 0;border-radius:14px;border:1px solid var(--line);background:var(--card);
    color:var(--text);font-size:21px;font-weight:600;cursor:pointer;transition:.1s}
  .keypad button:active{background:var(--card2)}
  .keypad button.op{color:var(--accent);font-weight:700}
  .keypad button.save{grid-row:span 2;background:var(--accent);color:#fff;border:none;font-size:16px;font-weight:700}
  .keypad button.wide{grid-column:span 1}
  .sheet h2{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
  .sheet h2 .x{cursor:pointer;color:var(--muted);font-size:26px;line-height:1}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .field input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);
    color:var(--text);font-size:15px;font-family:inherit;outline:none}
  .btn-primary{width:100%;padding:15px;border:none;border-radius:13px;background:var(--accent);color:#fff;
    font-size:15.5px;font-weight:700;cursor:pointer;margin-top:6px}
  .btn-del{width:100%;padding:13px;border:1px solid var(--expense);border-radius:13px;background:none;color:var(--expense);
    font-size:14px;font-weight:600;cursor:pointer;margin-top:9px}

  /* ===== Asset Graph (детали счёта) ===== */
  .detail-sheet{background:var(--bg);width:100%;max-width:560px;height:100%;max-height:100vh;border-radius:0;
    padding:max(14px,env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));overflow-y:auto;animation:fade .2s}
  .detail-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .detail-top .nm{font-size:18px;font-weight:700;display:flex;align-items:center;gap:9px}
  .detail-top .nm .em{width:32px;height:32px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:16px}
  .detail-top .r{display:flex;gap:7px}
  .detail-bal{text-align:center;margin:8px 0 4px}
  .detail-bal .l{font-size:12px;color:var(--muted)}
  .detail-bal .v{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
  .brkhead{display:flex;justify-content:space-between;align-items:center;padding:14px 4px 12px;font-size:13.5px;color:var(--muted);border-bottom:1px solid var(--line);margin-top:6px}
  .brkhead .tt{color:var(--expense);font-weight:700;font-size:15px}
  .brk{display:flex;align-items:center;gap:11px;padding:13px 4px;border-bottom:1px solid var(--line)}
  .brk:last-child{border-bottom:none}
  .pct-badge{min-width:44px;text-align:center;padding:4px 6px;border-radius:8px;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
  .brk .be{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px}
  .brk .bn{flex:1;font-size:14.5px;font-weight:600}
  .brk .bv{font-weight:700;font-size:14.5px}
  .brk .bv.exp{color:var(--expense)} .brk .bv.inc{color:var(--income)}
  .seg-ie{display:flex;gap:7px;margin:14px 0 4px}
  .seg-ie button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
  .seg-ie button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);
    color:var(--bg);padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;
    transition:.25s;z-index:90}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <!-- Top bar -->
  <div class="topbar">
    <div class="row1">
      <h1><span class="lg">💰</span><span id="screenTitle">Записи</span></h1>
      <div class="acts">
        <button class="iconbtn" id="exportTop" title="Экспорт данных (JSON)">⬇️</button>
        <button class="iconbtn" id="themeBtn">🌙</button>
      </div>
    </div>
    <div class="periods" id="periods">
      <button data-p="day">День</button>
      <button data-p="week">Неделя</button>
      <button data-p="month" class="on">Месяц</button>
      <button data-p="year">Год</button>
      <button data-p="all">Всё</button>
    </div>
    <div class="navrow" id="navrow">
      <button id="prevP">‹</button>
      <div class="lbl" id="periodLabel">—</div>
      <button id="nextP">›</button>
    </div>
  </div>

  <!-- Screen: Records -->
  <div class="screen active" id="scrRecords">
    <div class="summary">
      <div class="top">
        <div>
          <div class="bal-l">Баланс за период</div>
          <div class="bal" id="sumBal">€0</div>
        </div>
      </div>
      <div class="ie">
        <div class="b"><div class="l"><span class="ar">↓</span> Доходы</div><div class="v" id="sumInc">€0</div></div>
        <div class="b"><div class="l"><span class="ar">↑</span> Расходы</div><div class="v" id="sumExp">€0</div></div>
      </div>
    </div>
    <div id="txList"></div>
  </div>

  <!-- Screen: Charts -->
  <div class="screen" id="scrCharts">
    <div class="panel">
      <h3>Доходы и расходы <span class="hint">6 периодов</span></h3>
      <div class="chart-box tall"><canvas id="barChart"></canvas></div>
    </div>
    <div class="panel">
      <h3>Расходы по категориям</h3>
      <div class="chart-box"><canvas id="pieChart"></canvas></div>
      <div class="catlist" id="catLegend"></div>
    </div>
  </div>

  <!-- Screen: Budgets -->
  <div class="screen" id="scrBudgets">
    <div id="budList"></div>
  </div>

  <!-- Screen: More (accounts + settings) -->
  <div class="screen" id="scrMore">
    <h3 style="font-size:14px;color:var(--muted);margin:4px 4px 12px">Счета</h3>
    <div id="accList"></div>
    <button class="addline" id="addAccBtn" style="margin-bottom:22px">＋ Добавить счёт</button>

    <h3 style="font-size:14px;color:var(--muted);margin:4px 4px 12px">Настройки</h3>
    <div class="setrow">
      <span>Валюта</span>
      <select id="curSelect">
        <option value="€">€ Евро</option><option value="$">$ Доллар</option>
        <option value="₽">₽ Рубль</option><option value="£">£ Фунт</option>
        <option value="₸">₸ Тенге</option><option value="₴">₴ Гривна</option>
      </select>
    </div>
    <div class="setrow"><span>Экспорт данных</span><button id="exportBtn">Скачать JSON</button></div>
    <div class="setrow"><span>Импорт данных</span><button id="importBtn">Загрузить</button>
      <input type="file" id="importFile" accept="application/json" hidden></div>
    <div class="setrow"><span>Демо-данные</span><button id="demoBtn">Заполнить</button></div>
    <div class="setrow"><span style="color:var(--expense)">Удалить всё</span><button class="danger" id="clearBtn">Очистить</button></div>
    <p style="text-align:center;color:var(--muted2);font-size:11.5px;margin-top:14px">Финансы · в стиле Money Flow</p>
  </div>
</div>

<!-- Bottom nav -->
<div class="nav">
  <button class="on" data-s="scrRecords"><span class="ic">📋</span>Записи</button>
  <button data-s="scrCharts"><span class="ic">📊</span>Графики</button>
  <button class="addbtn" id="addBtn"><span class="plus">+</span></button>
  <button data-s="scrBudgets"><span class="ic">🎯</span>Бюджеты</button>
  <button data-s="scrMore"><span class="ic">⚙️</span>Ещё</button>
</div>

<!-- Add / edit sheet -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="grab"></div>
    <div class="seg">
      <button id="segExp" class="on-exp">Расход</button>
      <button id="segInc">Доход</button>
    </div>
    <div class="display"><span class="cur" id="dispCur">€</span><span class="num" id="dispNum">0</span></div>
    <div class="cat-strip" id="catStrip"></div>
    <div class="metarow">
      <div class="m"><label>Счёт</label><select id="fAccount"></select></div>
      <div class="m"><label>Дата</label><input type="date" id="fDate"></div>
    </div>
    <div class="field" style="margin-bottom:12px">
      <input type="text" id="fNote" placeholder="Комментарий (необязательно)">
    </div>
    <div class="keypad">
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="÷">÷</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="×">×</button>
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="−">−</button>
      <button data-k=".">.</button><button data-k="0">0</button><button data-k="back">⌫</button><button class="op" data-k="+">+</button>
      <button class="op" data-k="clear">C</button><button data-k="back-hold" style="visibility:hidden"></button><button class="save" id="saveBtn">✓</button>
    </div>
    <button class="btn-del" id="delBtn" style="display:none">Удалить операцию</button>
    <button class="x" id="closeSheet" style="position:absolute;top:14px;right:18px;background:none;border:none;font-size:26px;color:var(--muted);cursor:pointer">×</button>
  </div>
</div>

<!-- Account editor -->
<div class="overlay" id="accOverlay">
  <div class="sheet" style="max-width:420px">
    <div class="grab"></div>
    <h2><span id="accTitle">Новый счёт</span><span class="x" id="closeAcc">×</span></h2>
    <div class="cat-strip" id="accEmojiStrip" style="margin-bottom:14px"></div>
    <div class="field"><label>Название</label><input type="text" id="accName" placeholder="Например: Карта"></div>
    <div class="field"><label>Начальный баланс</label><input type="number" id="accStart" placeholder="0" inputmode="decimal"></div>
    <button class="btn-primary" id="saveAcc">Сохранить</button>
    <button class="btn-del" id="delAcc" style="display:none">Удалить счёт</button>
  </div>
</div>

<!-- Asset Graph: детали счёта -->
<div class="overlay" id="detailOverlay" style="align-items:flex-start">
  <div class="detail-sheet">
    <div class="detail-top">
      <div class="nm"><span class="em" id="dEm">💳</span><span id="dName">Счёт</span></div>
      <div class="r">
        <button class="iconbtn" id="dEdit">✏️</button>
        <button class="iconbtn" id="dClose">×</button>
      </div>
    </div>
    <div class="navrow" style="margin-top:6px">
      <button id="dPrev">‹</button>
      <div class="lbl" id="dPeriod">—</div>
      <button id="dNext">›</button>
    </div>
    <div class="detail-bal"><div class="l">Баланс счёта на конец месяца</div><div class="v" id="dBal">€0</div></div>
    <div class="panel" style="margin-top:10px"><div class="chart-box tall"><canvas id="lineChart"></canvas></div></div>
    <div class="seg-ie" id="dSeg">
      <button class="on" data-t="expense">Расходы</button>
      <button data-t="income">Доходы</button>
    </div>
    <div id="dBreakdown"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ Категории ============ */
const CATS = {
  expense: [
    {id:'food',name:'Еда',emoji:'🍔',color:'#ff6b6b'},
    {id:'transport',name:'Транспорт',emoji:'🚗',color:'#ffa94d'},
    {id:'home',name:'Жильё',emoji:'🏠',color:'#ffd43b'},
    {id:'shopping',name:'Покупки',emoji:'🛍️',color:'#da77f2'},
    {id:'health',name:'Здоровье',emoji:'💊',color:'#ff8787'},
    {id:'fun',name:'Развлечения',emoji:'🎮',color:'#9775fa'},
    {id:'bills',name:'Счета',emoji:'📄',color:'#4dabf7'},
    {id:'cafe',name:'Кафе',emoji:'☕',color:'#f783ac'},
    {id:'travel',name:'Поездки',emoji:'✈️',color:'#3bc9db'},
    {id:'edu',name:'Учёба',emoji:'📚',color:'#69db7c'},
    {id:'pets',name:'Питомцы',emoji:'🐾',color:'#a9e34b'},
    {id:'other_e',name:'Другое',emoji:'📦',color:'#868e96'},
  ],
  income: [
    {id:'salary',name:'Зарплата',emoji:'💼',color:'#3ecf8e'},
    {id:'freelance',name:'Подработка',emoji:'🧑‍💻',color:'#38d9a9'},
    {id:'gift',name:'Подарок',emoji:'🎁',color:'#63e6be'},
    {id:'invest',name:'Инвестиции',emoji:'📈',color:'#20c997'},
    {id:'rent',name:'Аренда',emoji:'🔑',color:'#0ca678'},
    {id:'other_i',name:'Другое',emoji:'💵',color:'#82c91e'},
  ]
};
const allCats=[...CATS.expense,...CATS.income];
const catById=id=>allCats.find(c=>c.id===id)||{name:'Другое',emoji:'❓',color:'#868e96'};
const ACC_EMOJI=['💵','💳','🏦','💰','🪙','📱','💶','🎒'];

/* ============ Состояние ============ */
let state={
  tx:[],
  accounts:[{id:'cash',name:'Наличные',emoji:'💵',start:0},{id:'card',name:'Карта',emoji:'💳',start:0}],
  budgets:{},
  currency:'€', theme:'dark'
};
let anchor=new Date();
let period='month';
let curScreen='scrRecords';
// add-sheet state
let aType='expense', aCat='food', aExpr='0', editId=null;
// account editor
let accEdit=null, accEmoji='💳';
// asset graph detail
let detailAcc=null, detailAnchor=new Date(), detailType='expense', lineChart;

const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const num=n=>state.currency+Number(n).toLocaleString('ru-RU',{maximumFractionDigits:2});
const signed=(n,t)=>(t==='income'?'+':'−')+state.currency+Math.abs(n).toLocaleString('ru-RU',{maximumFractionDigits:2});

/* ============ Хранилище + миграция ============ */
function load(){
  try{
    const raw=localStorage.getItem('finance_app');
    if(raw){
      const d=JSON.parse(raw);
      state=Object.assign(state,d);
      if(!state.accounts||!state.accounts.length) state.accounts=[{id:'cash',name:'Наличные',emoji:'💵',start:0}];
      if(!state.budgets) state.budgets={};
      // миграция: операции без счёта -> первый счёт
      const def=state.accounts[0].id;
      state.tx.forEach(t=>{if(!t.account)t.account=def;});
    }
  }catch(e){}
  document.documentElement.setAttribute('data-theme',state.theme);
  $('#themeBtn').textContent=state.theme==='dark'?'🌙':'☀️';
  $('#curSelect').value=state.currency;
}
function save(){localStorage.setItem('finance_app',JSON.stringify(state));}

/* ============ Период ============ */
function periodRange(){
  const a=new Date(anchor); a.setHours(0,0,0,0);
  let from,to;
  if(period==='day'){from=new Date(a);to=new Date(a);to.setHours(23,59,59,999);}
  else if(period==='week'){
    const dow=(a.getDay()+6)%7; from=new Date(a);from.setDate(a.getDate()-dow);
    to=new Date(from);to.setDate(from.getDate()+6);to.setHours(23,59,59,999);
  }else if(period==='month'){from=new Date(a.getFullYear(),a.getMonth(),1);to=new Date(a.getFullYear(),a.getMonth()+1,0,23,59,59);}
  else if(period==='year'){from=new Date(a.getFullYear(),0,1);to=new Date(a.getFullYear(),11,31,23,59,59);}
  else{from=new Date(2000,0,1);to=new Date(2999,0,1);}
  return {from,to};
}
function periodLabel(){
  const a=anchor;
  if(period==='day')return a.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
  if(period==='week'){const {from,to}=periodRange();return from.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+' – '+to.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});}
  if(period==='month')return a.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  if(period==='year')return String(a.getFullYear());
  return 'Все операции';
}
function shiftPeriod(dir){
  const a=new Date(anchor);
  if(period==='day')a.setDate(a.getDate()+dir);
  else if(period==='week')a.setDate(a.getDate()+7*dir);
  else if(period==='month')a.setMonth(a.getMonth()+dir);
  else if(period==='year')a.setFullYear(a.getFullYear()+dir);
  anchor=a; render();
}
function inPeriod(t){const {from,to}=periodRange();const d=new Date(t.date);return d>=from&&d<=to;}

/* ============ Рендер ============ */
let barChart,pieChart;
function render(){
  $('#periodLabel').textContent=periodLabel();
  $('#navrow').style.visibility=period==='all'?'hidden':'visible';
  $$('#periods button').forEach(b=>b.classList.toggle('on',b.dataset.p===period));
  $('#dispCur').textContent=state.currency;

  const list=state.tx.filter(inPeriod);
  const inc=list.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const exp=list.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  $('#sumInc').textContent=num(inc);
  $('#sumExp').textContent=num(exp);
  $('#sumBal').textContent=(inc-exp<0?'−':'')+num(Math.abs(inc-exp));

  renderTx(list);
  renderCharts(list);
  renderBudgets();
  renderAccounts();
}

function renderTx(list){
  const el=$('#txList');
  if(!list.length){el.innerHTML=`<div class="empty"><div class="big">🗒️</div><p>Нет операций за этот период.<br>Нажмите «+», чтобы добавить.</p></div>`;return;}
  const byDay={};
  list.forEach(t=>{(byDay[t.date.slice(0,10)]=byDay[t.date.slice(0,10)]||[]).push(t);});
  const days=Object.keys(byDay).sort((a,b)=>b.localeCompare(a));
  el.innerHTML=days.map(day=>{
    const items=byDay[day].sort((a,b)=>b.id-a.id);
    const net=items.reduce((s,t)=>s+(t.type==='income'?t.amount:-t.amount),0);
    const dd=new Date(day);
    const dl=dd.toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long'});
    return `<div class="daygroup">
      <div class="dayhead"><span class="dl">${dl}</span>
        <span class="dr" style="color:${net>=0?'var(--income)':'var(--text)'}">${(net>=0?'+':'−')+num(Math.abs(net))}</span></div>
      <div class="daycard">${items.map(txRow).join('')}</div>
    </div>`;
  }).join('');
  $$('#txList .tx').forEach(r=>r.onclick=()=>openSheet(r.dataset.id));
}
function txRow(t){
  const c=catById(t.cat);
  const acc=state.accounts.find(a=>a.id===t.account);
  return `<div class="tx" data-id="${t.id}">
    <div class="em" style="background:${c.color}22">${c.emoji}</div>
    <div class="info"><div class="t1">${c.name}</div>
      <div class="t2">${(acc?acc.emoji+' '+acc.name:'')}${t.note?' · '+esc(t.note):''}</div></div>
    <div class="amt ${t.type==='income'?'inc':'exp'}">${signed(t.amount,t.type)}</div>
  </div>`;
}

function renderCharts(list){
  // pie
  const exp=list.filter(t=>t.type==='expense');
  const byCat={};exp.forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)+t.amount);
  const entries=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const total=entries.reduce((s,e)=>s+e[1],0);
  const leg=$('#catLegend');
  leg.innerHTML=entries.length?entries.map(e=>{const c=catById(e[0]);
    return `<div class="catrow"><span class="cdot" style="background:${c.color}"></span>
      <span class="cname">${c.name}</span><span class="cval">${num(e[1])}</span>
      <span class="cpct">${Math.round(e[1]/total*100)}%</span></div>`;}).join('')
    :`<div style="text-align:center;color:var(--muted2);font-size:13px;padding:6px">Нет расходов</div>`;
  if(pieChart)pieChart.destroy();
  pieChart=new Chart($('#pieChart'),{type:'doughnut',
    data:{labels:entries.map(e=>catById(e[0]).name),datasets:[{data:entries.length?entries.map(e=>e[1]):[1],
      backgroundColor:entries.length?entries.map(e=>catById(e[0]).color):['#2a2f3a'],borderWidth:0}]},
    options:{cutout:'66%',maintainAspectRatio:false,plugins:{legend:{display:false},
      tooltip:{enabled:entries.length>0,callbacks:{label:c=>' '+num(c.raw)}}}}});

  // bar: 6 periods back
  const labels=[],incD=[],expD=[];
  for(let i=5;i>=0;i--){
    const r=rangeBack(i);
    labels.push(r.label);
    incD.push(state.tx.filter(t=>t.type==='income'&&inRange(t,r)).reduce((s,t)=>s+t.amount,0));
    expD.push(state.tx.filter(t=>t.type==='expense'&&inRange(t,r)).reduce((s,t)=>s+t.amount,0));
  }
  const css=getComputedStyle(document.documentElement),muted=css.getPropertyValue('--muted').trim(),grid=css.getPropertyValue('--line').trim();
  if(barChart)barChart.destroy();
  barChart=new Chart($('#barChart'),{type:'bar',
    data:{labels,datasets:[
      {label:'Доходы',data:incD,backgroundColor:css.getPropertyValue('--income').trim(),borderRadius:6,maxBarThickness:20},
      {label:'Расходы',data:expD,backgroundColor:css.getPropertyValue('--expense').trim(),borderRadius:6,maxBarThickness:20}]},
    options:{maintainAspectRatio:false,plugins:{legend:{labels:{color:muted,boxWidth:12,padding:12,font:{size:12}}},
      tooltip:{callbacks:{label:c=>c.dataset.label+': '+num(c.raw)}}},
      scales:{x:{grid:{display:false},ticks:{color:muted}},
        y:{grid:{color:grid},ticks:{color:muted,callback:v=>v>=1000?(v/1000)+'k':v},beginAtZero:true}}}});
}
function rangeBack(i){
  const a=new Date(anchor);let from,to,label;
  if(period==='day'){const d=new Date(a);d.setDate(a.getDate()-i);from=new Date(d.setHours(0,0,0,0));to=new Date(from);to.setHours(23,59,59,999);label=new Date(from).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});}
  else if(period==='week'){const d=new Date(a);d.setDate(a.getDate()-7*i);const dow=(d.getDay()+6)%7;from=new Date(d);from.setDate(d.getDate()-dow);from.setHours(0,0,0,0);to=new Date(from);to.setDate(from.getDate()+6);to.setHours(23,59,59,999);label=from.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});}
  else if(period==='year'){from=new Date(a.getFullYear()-i,0,1);to=new Date(a.getFullYear()-i,11,31,23,59,59);label=String(from.getFullYear());}
  else{from=new Date(a.getFullYear(),a.getMonth()-i,1);to=new Date(a.getFullYear(),a.getMonth()-i+1,0,23,59,59);label=from.toLocaleDateString('ru-RU',{month:'short'});}
  return {from,to,label};
}
function inRange(t,r){const d=new Date(t.date);return d>=r.from&&d<=r.to;}

function renderBudgets(){
  const el=$('#budList');
  const {from,to}=(function(){const a=new Date(anchor);return {from:new Date(a.getFullYear(),a.getMonth(),1),to:new Date(a.getFullYear(),a.getMonth()+1,0,23,59,59)};})();
  const spent={};
  state.tx.filter(t=>{const d=new Date(t.date);return t.type==='expense'&&d>=from&&d<=to;}).forEach(t=>spent[t.cat]=(spent[t.cat]||0)+t.amount);
  el.innerHTML=`<p style="color:var(--muted);font-size:12.5px;margin:2px 4px 14px">Лимиты расходов на месяц (${from.toLocaleDateString('ru-RU',{month:'long'})}). Введите сумму, чтобы задать бюджет.</p>`+
    CATS.expense.map(c=>{
      const lim=state.budgets[c.id]||0;const sp=spent[c.id]||0;
      const pct=lim?Math.min(100,sp/lim*100):0;
      const over=lim&&sp>lim;
      const col=over?'var(--expense)':pct>80?'#ffa94d':c.color;
      return `<div class="bud">
        <div class="h"><div class="em" style="background:${c.color}22">${c.emoji}</div>
          <div class="nm">${c.name}</div>
          <div class="lim"><input type="number" inputmode="decimal" placeholder="—" value="${lim||''}" data-bud="${c.id}"> ${state.currency}</div></div>
        <div class="progress"><div class="fill" style="width:${pct}%;background:${col}"></div></div>
        <div class="sub"><span>Потрачено: ${num(sp)}</span><span>${lim?(over?'Превышен на '+num(sp-lim):'Осталось '+num(lim-sp)):'без лимита'}</span></div>
      </div>`;
    }).join('');
  $$('#budList input[data-bud]').forEach(i=>i.onchange=()=>{
    const v=parseFloat(i.value)||0;
    if(v>0)state.budgets[i.dataset.bud]=v;else delete state.budgets[i.dataset.bud];
    save();renderBudgets();
  });
}

function renderAccounts(){
  const el=$('#accList');
  el.innerHTML=state.accounts.map(a=>{
    const bal=a.start+state.tx.filter(t=>t.account===a.id).reduce((s,t)=>s+(t.type==='income'?t.amount:-t.amount),0);
    return `<div class="acc" data-acc="${a.id}">
      <div class="em" style="background:var(--accent-soft)">${a.emoji}</div>
      <div class="nm">${esc(a.name)}</div>
      <div class="bal" style="color:${bal>=0?'var(--text)':'var(--expense)'}">${(bal<0?'−':'')+num(Math.abs(bal))}</div>
    </div>`;
  }).join('');
  $$('#accList .acc').forEach(r=>r.onclick=()=>openAccountGraph(r.dataset.acc));
}

/* ============ Asset Graph: детали счёта ============ */
function pctColor(p){
  if(p>=50)return '#e8503a'; if(p>=25)return '#ff922b'; if(p>=10)return '#fcc419';
  if(p>=1)return '#a9e34b'; return '#51cf66';
}
// плагин: подписи значений над точками линии
const vLabels={id:'vlabels',afterDatasetsDraw(chart){
  const m=chart.getDatasetMeta(0);if(!m||!m.data)return;
  const ctx=chart.ctx;const css=getComputedStyle(document.documentElement);
  ctx.save();ctx.font='600 10px -apple-system,system-ui,sans-serif';
  ctx.fillStyle=css.getPropertyValue('--muted').trim();ctx.textAlign='center';
  m.data.forEach((pt,i)=>{const v=chart.data.datasets[0].data[i];
    if(v===null||v===undefined)return;
    ctx.fillText(Math.round(v).toLocaleString('ru-RU'),pt.x,pt.y-9);});
  ctx.restore();
}};
function accBalanceAt(accId,endDate){
  const a=state.accounts.find(x=>x.id===accId);
  return (a?a.start:0)+state.tx.filter(t=>t.account===accId&&new Date(t.date)<=endDate)
    .reduce((s,t)=>s+(t.type==='income'?t.amount:-t.amount),0);
}
function openAccountGraph(id){
  detailAcc=id; detailAnchor=new Date(anchor); detailType='expense';
  $$('#dSeg button').forEach(b=>b.classList.toggle('on',b.dataset.t==='expense'));
  $('#detailOverlay').classList.add('show');
  renderDetail();
}
function renderDetail(){
  const a=state.accounts.find(x=>x.id===detailAcc);if(!a)return;
  $('#dEm').textContent=a.emoji;$('#dName').textContent=a.name;
  $('#dPeriod').textContent=detailAnchor.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  // линия: баланс на конец каждого из 6 месяцев
  const labels=[],data=[];
  for(let i=5;i>=0;i--){
    const d=new Date(detailAnchor.getFullYear(),detailAnchor.getMonth()-i+1,0,23,59,59);
    labels.push(d.toLocaleDateString('ru-RU',{month:'short'}));
    data.push(Math.round(accBalanceAt(detailAcc,d)*100)/100);
  }
  $('#dBal').textContent=(data[5]<0?'−':'')+num(Math.abs(data[5]));
  const css=getComputedStyle(document.documentElement);
  const txc=css.getPropertyValue('--text').trim(),muted=css.getPropertyValue('--muted').trim(),grid=css.getPropertyValue('--line').trim();
  if(lineChart)lineChart.destroy();
  lineChart=new Chart($('#lineChart'),{type:'line',
    data:{labels,datasets:[{data,borderColor:txc,backgroundColor:txc,tension:0,
      pointRadius:4,pointBackgroundColor:css.getPropertyValue('--bg').trim(),pointBorderColor:txc,pointBorderWidth:2,borderWidth:2}]},
    options:{maintainAspectRatio:false,layout:{padding:{top:18,right:8,left:4}},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>num(c.raw)}}},
      scales:{x:{grid:{display:false},ticks:{color:muted}},
        y:{grid:{color:grid},ticks:{color:muted,callback:v=>v>=1000||v<=-1000?(v/1000)+'k':v}}}},
    plugins:[vLabels]});
  // разбивка по категориям за месяц
  const from=new Date(detailAnchor.getFullYear(),detailAnchor.getMonth(),1);
  const to=new Date(detailAnchor.getFullYear(),detailAnchor.getMonth()+1,0,23,59,59);
  const items=state.tx.filter(t=>t.account===detailAcc&&t.type===detailType&&new Date(t.date)>=from&&new Date(t.date)<=to);
  const byCat={};items.forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)+t.amount);
  const entries=Object.entries(byCat).sort((x,y)=>y[1]-x[1]);
  const total=entries.reduce((s,e)=>s+e[1],0);
  const lbl=detailType==='expense'?'Расходы':'Доходы';
  let html=`<div class="brkhead"><span>${lbl}</span><span class="tt" style="color:${detailType==='expense'?'var(--expense)':'var(--income)'}">${num(total)}</span></div>`;
  if(!entries.length)html+=`<div style="text-align:center;color:var(--muted2);font-size:13px;padding:24px">Нет операций за месяц</div>`;
  else html+=entries.map(e=>{const c=catById(e[0]);const p=Math.round(e[1]/total*100);
    return `<div class="brk">
      <span class="pct-badge" style="background:${pctColor(p)}">${p}%</span>
      <span class="be" style="background:${c.color}22">${c.emoji}</span>
      <span class="bn">${c.name}</span>
      <span class="bv ${detailType==='expense'?'exp':'inc'}">${num(e[1])}</span></div>`;}).join('');
  $('#dBreakdown').innerHTML=html;
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

/* ============ Экраны ============ */
function showScreen(id){
  curScreen=id;
  $$('.screen').forEach(s=>s.classList.toggle('active',s.id===id));
  $$('.nav button[data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===id));
  const titles={scrRecords:'Записи',scrCharts:'Графики',scrBudgets:'Бюджеты',scrMore:'Ещё'};
  $('#screenTitle').textContent=titles[id];
  // период скрываем на «Ещё»
  $('.periods').style.display=id==='scrMore'?'none':'flex';
  $('#navrow').style.display=(id==='scrMore'||period==='all')?(id==='scrMore'?'none':'flex'):'flex';
  if(id==='scrMore')$('#navrow').style.display='none';
  render();
}

/* ============ Калькулятор / лист добавления ============ */
function openSheet(id){
  editId=id||null;
  if(id){
    const t=state.tx.find(x=>x.id==id);
    aType=t.type;aExpr=String(t.amount);aCat=t.cat;
    $('#fDate').value=t.date.slice(0,10);$('#fNote').value=t.note||'';
    $('#fAccount').value=t.account;
    $('#delBtn').style.display='block';
  }else{
    aType='expense';aExpr='0';aCat=CATS.expense[0].id;
    $('#fDate').value=new Date().toISOString().slice(0,10);$('#fNote').value='';
    $('#delBtn').style.display='none';
  }
  buildAccountSelect();
  if(id)$('#fAccount').value=state.tx.find(x=>x.id==id).account;
  setType(aType,true);
  updateDisplay();
  $('#overlay').classList.add('show');
}
function closeSheet(){$('#overlay').classList.remove('show');}
function buildAccountSelect(){
  $('#fAccount').innerHTML=state.accounts.map(a=>`<option value="${a.id}">${a.emoji} ${esc(a.name)}</option>`).join('');
}
function setType(t,keepCat){
  aType=t;
  $('#segExp').className=t==='expense'?'on-exp':'';
  $('#segInc').className=t==='income'?'on-inc':'';
  if(!keepCat)aCat=CATS[t][0].id;
  else if(!CATS[t].find(c=>c.id===aCat))aCat=CATS[t][0].id;
  $('#catStrip').innerHTML=CATS[t].map(c=>
    `<div class="cat-pick ${c.id===aCat?'sel':''}" data-cat="${c.id}">
      <span class="ce" style="background:${c.color}22">${c.emoji}</span><span class="cl">${c.name}</span></div>`).join('');
  $$('#catStrip .cat-pick').forEach(el=>el.onclick=()=>{
    aCat=el.dataset.cat;$$('#catStrip .cat-pick').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');
  });
}
function updateDisplay(){$('#dispNum').textContent=aExpr;}
function evalExpr(e){
  let s=e.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  if(!/^[0-9+\-*/.\s]+$/.test(s))return NaN;
  s=s.replace(/[+\-*/.]$/,'');
  try{const r=Function('"use strict";return('+s+')')();return isFinite(r)?Math.round(r*100)/100:NaN;}catch(e){return NaN;}
}
function key(k){
  if(k==='clear'){aExpr='0';}
  else if(k==='back'){aExpr=aExpr.length>1?aExpr.slice(0,-1):'0';}
  else if('+−×÷'.includes(k)){
    if('+−×÷'.includes(aExpr.slice(-1)))aExpr=aExpr.slice(0,-1)+k;
    else aExpr+=k;
  }
  else if(k==='.'){
    const last=aExpr.split(/[+\-−×÷]/).pop();
    if(!last.includes('.'))aExpr+='.';
  }
  else{ // digit
    if(aExpr==='0')aExpr=k; else aExpr+=k;
  }
  updateDisplay();
}
function saveTx(){
  const val=evalExpr(aExpr);
  if(!val||val<=0){toast('Введите сумму');return;}
  if(editId){
    const t=state.tx.find(x=>x.id==editId);
    Object.assign(t,{type:aType,amount:val,cat:aCat,account:$('#fAccount').value,date:$('#fDate').value,note:$('#fNote').value.trim()});
  }else{
    state.tx.push({id:Date.now(),type:aType,amount:val,cat:aCat,account:$('#fAccount').value,
      date:$('#fDate').value||new Date().toISOString().slice(0,10),note:$('#fNote').value.trim()});
  }
  save();closeSheet();
  anchor=new Date($('#fDate').value);render();
  toast(editId?'Сохранено ✓':(aType==='income'?'Доход добавлен ✓':'Расход добавлен ✓'));
}
function delTx(){
  if(!editId)return;
  if(confirm('Удалить операцию?')){state.tx=state.tx.filter(t=>t.id!=editId);save();closeSheet();render();toast('Удалено');}
}

/* ============ Счета ============ */
function openAcc(id){
  accEdit=id||null;
  if(id){const a=state.accounts.find(x=>x.id===id);accEmoji=a.emoji;$('#accName').value=a.name;$('#accStart').value=a.start||'';
    $('#accTitle').textContent='Счёт';$('#delAcc').style.display=state.accounts.length>1?'block':'none';}
  else{accEmoji='💳';$('#accName').value='';$('#accStart').value='';$('#accTitle').textContent='Новый счёт';$('#delAcc').style.display='none';}
  $('#accEmojiStrip').innerHTML=ACC_EMOJI.map(e=>
    `<div class="cat-pick ${e===accEmoji?'sel':''}" data-e="${e}" style="width:54px"><span class="ce">${e}</span></div>`).join('');
  $$('#accEmojiStrip .cat-pick').forEach(el=>el.onclick=()=>{accEmoji=el.dataset.e;
    $$('#accEmojiStrip .cat-pick').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');});
  $('#accOverlay').classList.add('show');
}
function saveAcc(){
  const name=$('#accName').value.trim()||'Счёт';const start=parseFloat($('#accStart').value)||0;
  if(accEdit){const a=state.accounts.find(x=>x.id===accEdit);Object.assign(a,{name,emoji:accEmoji,start});}
  else state.accounts.push({id:'a'+Date.now(),name,emoji:accEmoji,start});
  save();$('#accOverlay').classList.remove('show');render();buildAccountSelect();toast('Сохранено ✓');
}
function delAcc(){
  if(!accEdit)return;
  const has=state.tx.some(t=>t.account===accEdit);
  if(has&&!confirm('На счёте есть операции. Они перейдут на первый счёт. Удалить?'))return;
  state.tx.forEach(t=>{if(t.account===accEdit)t.account=state.accounts.find(a=>a.id!==accEdit).id;});
  state.accounts=state.accounts.filter(a=>a.id!==accEdit);
  save();$('#accOverlay').classList.remove('show');render();buildAccountSelect();toast('Счёт удалён');
}

/* ============ Прочее ============ */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1700);}
function loadDemo(){
  const today=new Date(),tx=[],rnd=(a,b)=>Math.round(a+Math.random()*(b-a));
  const accs=state.accounts.map(a=>a.id);
  for(let m=0;m<3;m++){
    const base=new Date(today.getFullYear(),today.getMonth()-m,1);
    tx.push({id:Date.now()+Math.random(),type:'income',amount:rnd(2200,2600),cat:'salary',account:accs[0],date:dstr(base,5),note:'Зарплата'});
    tx.push({id:Date.now()+Math.random(),type:'income',amount:rnd(200,500),cat:'freelance',account:accs[1]||accs[0],date:dstr(base,18),note:''});
    [['food',rnd(280,420)],['transport',rnd(60,140)],['home',rnd(600,800)],['cafe',rnd(80,200)],
     ['shopping',rnd(100,350)],['fun',rnd(40,160)],['bills',rnd(90,180)],['health',rnd(20,120)]]
      .forEach((e,i)=>tx.push({id:Date.now()+Math.random()+i,type:'expense',amount:e[1],cat:e[0],account:accs[i%accs.length],date:dstr(base,3+i*3),note:''}));
  }
  state.tx=tx;state.budgets={food:400,transport:150,fun:200,cafe:150};
  save();anchor=new Date();render();toast('Демо-данные загружены');
}
function dstr(b,d){return new Date(b.getFullYear(),b.getMonth(),d).toISOString().slice(0,10);}

/* ============ События ============ */
$$('.nav button[data-s]').forEach(b=>b.onclick=()=>showScreen(b.dataset.s));
$('#addBtn').onclick=()=>openSheet(null);
$('#closeSheet').onclick=closeSheet;
$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeSheet();};
$('#segExp').onclick=()=>setType('expense');
$('#segInc').onclick=()=>setType('income');
$('#saveBtn').onclick=saveTx;
$('#delBtn').onclick=delTx;
$$('.keypad button[data-k]').forEach(b=>{const k=b.dataset.k;if(k&&k!=='back-hold')b.onclick=()=>key(k);});

$('#periods').querySelectorAll('button').forEach(b=>b.onclick=()=>{period=b.dataset.p;anchor=new Date();render();});
$('#prevP').onclick=()=>shiftPeriod(-1);
$('#nextP').onclick=()=>shiftPeriod(1);

$('#themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',state.theme);
  $('#themeBtn').textContent=state.theme==='dark'?'🌙':'☀️';save();render();};

$('#curSelect').onchange=e=>{state.currency=e.target.value;save();render();};
$('#addAccBtn').onclick=()=>openAcc(null);
$('#closeAcc').onclick=()=>$('#accOverlay').classList.remove('show');
$('#accOverlay').onclick=e=>{if(e.target.id==='accOverlay')$('#accOverlay').classList.remove('show');};
$('#saveAcc').onclick=saveAcc;
$('#delAcc').onclick=delAcc;

// Asset Graph detail
$('#dClose').onclick=()=>$('#detailOverlay').classList.remove('show');
$('#dEdit').onclick=()=>{$('#detailOverlay').classList.remove('show');openAcc(detailAcc);};
$('#dPrev').onclick=()=>{detailAnchor=new Date(detailAnchor.getFullYear(),detailAnchor.getMonth()-1,1);renderDetail();};
$('#dNext').onclick=()=>{detailAnchor=new Date(detailAnchor.getFullYear(),detailAnchor.getMonth()+1,1);renderDetail();};
$$('#dSeg button').forEach(b=>b.onclick=()=>{detailType=b.dataset.t;
  $$('#dSeg button').forEach(x=>x.classList.toggle('on',x===b));renderDetail();});

function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='finance-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('Файл сохранён ✓');
}
$('#exportBtn').onclick=exportData;
$('#exportTop').onclick=exportData;
$('#importBtn').onclick=()=>$('#importFile').click();
$('#importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(Array.isArray(d.tx)){state=Object.assign(state,d);save();load();render();toast('Данные загружены');}else toast('Неверный формат');}catch(_){toast('Ошибка чтения');}};
  r.readAsText(f);};
$('#demoBtn').onclick=loadDemo;
$('#clearBtn').onclick=()=>{if(confirm('Удалить все операции?')){state.tx=[];state.budgets={};save();render();toast('Данные удалены');}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();$('#accOverlay').classList.remove('show');$('#detailOverlay').classList.remove('show');}});

/* ============ Старт ============ */
load();
showScreen('scrRecords');

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body>
</html>
